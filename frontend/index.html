<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentSnap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A2030'/%3E%3Cpath d='M9 22 16 9l7 13' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='19' r='2.4' fill='%23E8590C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-live" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-chain" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
  <symbol id="i-policy" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m10 13-2 2 2 2"/><path d="m14 13 2 2-2 2"/></symbol>
  <symbol id="i-signal" viewBox="0 0 24 24"><path d="M5 13a7 7 0 0 1 14 0"/><path d="M8.5 13a3.5 3.5 0 0 1 7 0"/><path d="M12 13v8"/></symbol>
  <symbol id="i-graph" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8.3 7.1 15.6 7.6M7 8.4l1.4 7.2M16.6 10.1l-5.8 6.2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V11"/><path d="M10 20V5"/><path d="M16 20v-7"/><path d="M3 20h18"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v6c0 4.5 3.2 7.8 7.5 9 4.3-1.2 7.5-4.5 7.5-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-ops" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><path d="M9 22 16 9l7 13" stroke="var(--surface)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="19" r="2.4" fill="#E8590C"/></svg>
      <b>AgentSnap</b>
    </div>
    <nav id="nav" aria-label="Sections">
      <button data-view="live"><svg class="i"><use href="#i-live"/></svg>Live</button>
      <button data-view="chains"><svg class="i"><use href="#i-chain"/></svg>Kill chains</button>
      <button data-view="app"><svg class="i"><use href="#i-phone"/></svg>Investor app</button>
      <button data-view="graph"><svg class="i"><use href="#i-graph"/></svg>Mule graph</button>
      <div class="sep"></div>
      <button data-view="policy"><svg class="i"><use href="#i-policy"/></svg>Policy</button>
      <button data-view="telemetry"><svg class="i"><use href="#i-signal"/></svg>Signals</button>
      <button data-view="bench"><svg class="i"><use href="#i-chart"/></svg>Benchmark</button>
      <button data-view="audit"><svg class="i"><use href="#i-shield"/></svg>Audit</button>
      <button data-view="ops"><svg class="i"><use href="#i-ops"/></svg>Operations</button>
    </nav>
    <div class="side-foot">
      <span class="env" title="Synthetic accounts and events">Sandbox</span>
      <button class="icon-btn" id="theme" aria-label="Toggle dark mode"><svg class="i"><use href="#i-moon"/></svg></button>
    </div>
  </aside>
  <main>
    <section id="v-live" class="view" hidden></section>
    <section id="v-chains" class="view" hidden></section>
    <section id="v-app" class="view" hidden></section>
    <section id="v-graph" class="view" hidden></section>
    <section id="v-policy" class="view" hidden></section>
    <section id="v-telemetry" class="view" hidden></section>
    <section id="v-bench" class="view" hidden></section>
    <section id="v-audit" class="view" hidden></section>
    <section id="v-ops" class="view" hidden></section>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Details"><div class="drawer-h"><h2 id="drawer-title">Details</h2><button class="icon-btn" id="drawer-close" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div><div class="drawer-b" id="drawer-body"></div></aside>
<script src="/static/app.js"></script>
</body>
</html>
